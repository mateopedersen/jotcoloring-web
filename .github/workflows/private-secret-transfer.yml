name: Seal existing release credential for private Free migration
on:
  workflow_dispatch:
permissions: {}
jobs:
  seal:
    if: >-
      github.repository == 'mateopedersen/jotcoloring-web' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the sealed-box encryption library before reading the credential
        run: python -m pip install --disable-pip-version-check PyNaCl==1.6.0
      # No repository code is checked out or executed with the credential.
      # The recipient is this repository's GitHub Actions public encryption key.
      - name: Encrypt the existing scoped token for the same repository
        env:
          RELEASE_TOKEN: ${{ secrets[github.ref_name == 'main' && 'JOT_CF_PRODUCTION_DEPLOY_TOKEN' || 'JOT_CF_STAGING_DEPLOY_TOKEN'] }}
          TARGET_SECRET: ${{ github.ref_name == 'main' && 'JOT_CF_PRODUCTION_DEPLOY_TOKEN' || 'JOT_CF_STAGING_DEPLOY_TOKEN' }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          token = os.environ.pop('RELEASE_TOKEN', '')
          name = os.environ['TARGET_SECRET']
          if not token or name not in ('JOT_CF_PRODUCTION_DEPLOY_TOKEN', 'JOT_CF_STAGING_DEPLOY_TOKEN'):
              raise SystemExit('Expected existing environment credential is unavailable')
          public_key = PublicKey(base64.b64decode('nAWuZi2rbp28gictqt7+TzVOcAoQfNGUtYLVB/VvSVQ='))
          ciphertext = base64.b64encode(SealedBox(public_key).encrypt(token.encode())).decode()
          del token
          Path('sealed-release-credential.json').write_text(json.dumps({
              'repository': 'mateopedersen/jotcoloring-web',
              'name': name,
              'key_id': '3380204578043523366',
              'encrypted_value': ciphertext,
          }) + '\n')
          print('Existing scoped credential sealed for this repository; no plaintext was exported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-release-credential-${{ github.ref_name }}
          path: sealed-release-credential.json
          if-no-files-found: error
          retention-days: 1
