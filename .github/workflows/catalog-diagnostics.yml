name: Catalog diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact public page to diagnose with eight marked reads
        type: choice
        default: vehicles
        options:
          - vehicles
          - ages-9-12
          - veterans-day
permissions:
  contents: read
concurrency:
  group: jotcoloring-catalog-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'mateopedersen/jotcoloring-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Inspect only marked read-only public requests
        run: node scripts/ops/catalog-diagnostics.mjs
        env:
          JOT_DIAGNOSTIC_TARGET: ${{ inputs.target || 'vehicles' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.JOT_CF_PRODUCTION_DEPLOY_TOKEN }}
      - name: Save minimized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-diagnostics
          path: .local/catalog-diagnostics.json
          retention-days: 2
